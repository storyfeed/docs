<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Storyfeed">
  <title>Storyfeed</title>
  <!--
    The Collapse, amber on ink: three feed rows tapering into one solid bar —
    many activities becoming one telling. The ink field is part of the mark, not
    a backdrop: amber on white would be unreadable (1.7:1), so the badge carries
    its own background and reads identically on a light or a dark header.
    Amber on ink measures 10.7:1.
  -->
  <rect width="48" height="48" rx="10.5" fill="#0f172a"/>
  <g transform="translate(24 24) scale(0.75) translate(-24 -24)" fill="#fbbf24">
    <rect x="6"  y="7"  width="36" height="5" rx="2.5" opacity="0.45"/>
    <rect x="10" y="17" width="28" height="5" rx="2.5" opacity="0.7"/>
    <rect x="14" y="27" width="20" height="5" rx="2.5" opacity="0.85"/>
    <rect x="6"  y="37" width="36" height="6" rx="3"/>
  </g>
</svg>
