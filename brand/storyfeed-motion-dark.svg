<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -18 160 160" aria-label="Activities arriving, coming into focus, then receding" role="img"><style>.moment{transform-origin:64px 62px;animation:advance 20s infinite;animation-delay:var(--delay)}@keyframes advance{0%,15%{transform:translateY(110px) scale(.52);opacity:0}20%,35%{transform:translateY(66px) scale(.65);opacity:.52}40%,55%{transform:translateY(0) scale(1);opacity:1}60%,75%{transform:translateY(-66px) scale(.65);opacity:.52}80%,100%{transform:translateY(-110px) scale(.52);opacity:0}}.paused .moment{animation-play-state:paused}.static .moment{animation:none;opacity:0}.static .m0{transform:translateY(-66px) scale(.65);opacity:.52}.static .m1{transform:none;opacity:1}.static .m2{transform:translateY(66px) scale(.65);opacity:.52}@media(prefers-reduced-motion:reduce){.moment{animation:none!important;opacity:0}.m0{transform:translateY(-66px) scale(.65);opacity:.52}.m1{transform:none;opacity:1}.m2{transform:translateY(66px) scale(.65);opacity:.52}}</style><defs><linearGradient id="edge" x2="0" y2="1"><stop stop-color="white" stop-opacity="0"/><stop offset=".15" stop-color="white"/><stop offset=".85" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient><mask id="fade"><rect x="-15" y="-18" width="160" height="160" fill="url(#edge)"/></mask></defs><g mask="url(#fade)"><g class="moment m0" style="--delay:0s"><g xmlns="http://www.w3.org/2000/svg" opacity="1"><circle cx="20.4" cy="40.4" r="8.528" fill="#FBBF24" /><rect x="33.76" y="56.0" width="74.24000000000001" height="39.0" rx="6.5" fill="#438D98" /><rect x="17.799999999999997" y="58.599999999999994" width="5.2" height="36.400000000000006" rx="2.6" fill="#858585" /><rect x="33.76" y="34.55" width="74.24000000000001" height="11.7" rx="5.85" fill="#EE876B" /></g></g><g class="moment m1" style="--delay:-4s"><g xmlns="http://www.w3.org/2000/svg" opacity="1"><circle cx="20.4" cy="40.4" r="8.528" fill="#FBBF24" /><rect x="33.76" y="5