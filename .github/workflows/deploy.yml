name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One in-flight deploy at a time; a newer push supersedes a queued one but
# never cancels a running deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress lastUpdated reads git history, so a shallow clone would
          # stamp every page with the same date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # enablement lets the workflow turn Pages on itself, so a freshly created
      # repo needs no visit to Settings — and a future re-create can't leave the
      # deploy failing on a checkbox nobody remembers.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
