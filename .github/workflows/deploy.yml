name: Deploy docs

on:
  push:
    branches: [main]
  # Core's main changes without a push here: a nightly build regenerates the
  # world against it, and `core-main` lets core ask for one.
  schedule:
    - cron: '17 4 * * *'
  repository_dispatch:
    types: [core-main]
  workflow_dispatch: {}

# One in-flight deploy at a time; a newer push supersedes a queued one but
# never cancels a running deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storyfeed-docs
    env:
      STORYFEED_UI_PATH: ../storyfeed-ui/resources/js/vue
      # With core here, the build's drift guard checks the pages against core's
      # classes and migrations, and regenerates the world's feeds through core's
      # docs generator (scripts/payloads.mjs): a committed file that differs
      # from core's main fails the build.
      STORYFEED_CORE: ${{ github.workspace }}/storyfeed
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress lastUpdated reads git history, so a shallow clone would
          # stamp every page with the same date.
          fetch-depth: 0
          path: storyfeed-docs

      - uses: actions/checkout@v4
        with:
          repository: storyfeed/ui
          path: storyfeed-ui

      - uses: actions/checkout@v4
        with:
          repository: storyfeed/storyfeed
          path: storyfeed
          # The drift detector reads core's history for deleted classes.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: storyfeed

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storyfeed-docs/package-lock.json

      - run: npm ci

      - run: npm run build

      # No `enablement: true` here: it needs admin rights the workflow token does
      # not have in this org ("Resource not accessible by integration"), so it
      # fails in a way that reads like a config error. Pages was enabled once via
      # the API with build_type=workflow; if this repo is ever recreated, do that
      # again rather than trusting a flag that cannot work here.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storyfeed-docs/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
