name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One in-flight deploy at a time; a newer push supersedes a queued one but
# never cancels a running deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: storyfeed-docs
    env:
      STORYFEED_UI_PATH: ../storyfeed-ui/resources/js/vue
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress lastUpdated reads git history, so a shallow clone would
          # stamp every page with the same date.
          fetch-depth: 0
          path: storyfeed-docs

      - uses: actions/checkout@v4
        with:
          repository: storyfeed/ui
          path: storyfeed-ui

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: storyfeed-docs/package-lock.json

      - run: npm ci

      - run: npm run build

      # No `enablement: true` here: it needs admin rights the workflow token does
      # not have in this org ("Resource not accessible by integration"), so it
      # fails in a way that reads like a config error. Pages was enabled once via
      # the API with build_type=workflow; if this repo is ever recreated, do that
      # again rather than trusting a flag that cannot work here.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: storyfeed-docs/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
